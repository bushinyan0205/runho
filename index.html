<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .game, .guide{
            display: flex;
            justify-content: center;
        }
        .guide{
            margin: auto;
            max-width: 1200px;
            flex-wrap: wrap;
            justify-content: space-around;
            gap: 20px;
        }
        .guide .button .btn{
            padding: 20px;
            background: #aaaaaa;
            border-radius: 8px;
            color: #fff;
            font-size: 24px;
            font-weight: 700;
            display: inline-block;
        }
        .note{
            width: 100%;
            text-align: center;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="game"><iframe src="gamefile.html" width="1200" height="700" frameborder="0"></iframe></div>
    <div class="guide">
        <div class="button"><span class="btn">B</span> :Cúi xuống</div>
        <div class="button"><span class="btn">Space</span> :Nhảy</div>
        <p class="note">(Đây là v1.0, còn nâng cấp nhé cả nhà)</p>
    </div>
</body>
</html>
